<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StepStyle Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="center"><form id="loginForm"><h1>StepStyle Admin</h1><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Login</button><p id="error"></p></form></div>
<div id="app" hidden><header><b>StepStyle Admin Dashboard</b><button id="logout">Logout</button></header><section class="stats"><div>Appointments<strong id="total">0</strong></div><div>Pending<strong id="pending">0</strong></div><div>Confirmed<strong id="confirmed">0</strong></div><div>Messages<strong id="messagesCount">0</strong></div></section>
<section><h2>Appointments</h2><div class="table"><table><thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="appointments"></tbody></table></div></section>
<section><h2>Messages</h2><div class="table"><table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Action</th></tr></thead><tbody id="messages"></tbody></table></div></section></div><script src="admin.js"></script></body></html>
